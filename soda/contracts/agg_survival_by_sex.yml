dataset: titanic/analytics/marts/agg_survival_by_sex

checks:
  - schema:
      allow_extra_columns: false
  - row_count:
      threshold:
        must_equal: 2

columns:
  - name: sex
    checks:
      - missing:
      - duplicate:
      - invalid:
          valid_values:
            - male
            - female

  - name: total_passengers
    checks:
      - missing:
      - invalid:
          valid_min: 1

  - name: total_survivors
    checks:
      - missing:
      - invalid:
          valid_min: 0

  - name: total_deaths
    checks:
      - missing:
      - invalid:
          valid_min: 0

  - name: survival_rate
    checks:
      - missing:
      - invalid:
          valid_min: 0
          valid_max: 100
